name: 每周自动抓取最新真题

on:
  schedule:
    # 每周一 01:37 UTC = 北京时间 09:37
    - cron: '37 1 * * 1'
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取最新真题并补解析
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/scrape_real_exams.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无新增真题，跳过提交"
          else
            git commit -m "自动更新题库：抓取最新一期网络工程师上午真题"
            git push
          fi
