<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软考网络工程师刷题</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="网络工程师刷题">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">📡 软考网络工程师刷题</div>
    <nav class="nav">
      <button class="nav-btn active" data-view="home">首页</button>
      <button class="nav-btn" data-view="chapter">章节练习</button>
      <button class="nav-btn" data-view="random">随机刷题</button>
      <button class="nav-btn" data-view="exam">模拟考试</button>
      <button class="nav-btn" data-view="wrong">错题本</button>
      <button class="nav-btn" data-view="favorite">收藏</button>
    </nav>
  </header>

  <main id="app"></main>

  <script src="data/papers.js"></script>
  <script src="data/paper1.js"></script>
  <script src="data/paper2.js"></script>
  <script src="data/paper3.js"></script>
  <script src="data/chapters.js"></script>
  <script src="app.js"></script>
  <script>
    // 注册 Service Worker（用于离线缓存；file:// 或 https 环境下会静默跳过）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
